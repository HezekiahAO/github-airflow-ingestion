# Local Airflow 3 + PostgreSQL. Based on the official Airflow docker-compose,
# simplified to LocalExecutor (no Redis/Celery) for a single machine.
x-airflow-common: &airflow-common
  build: .
  image: github-airflow-ingestion:3.3.2
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Airflow connection `github_postgres`, defined by environment variable (not stored in the UI/DB).
    AIRFLOW_CONN_GITHUB_POSTGRES: postgresql://${GITHUB_DB_USER}:${GITHUB_DB_PASSWORD}@postgres:5432/${GITHUB_DB_NAME}
    TEST_DATABASE_URL: postgresql://${GITHUB_DB_USER}:${GITHUB_DB_PASSWORD}@postgres:5432/${GITHUB_DB_NAME}_test
    PIPELINE_DATA_DIR: /opt/airflow/data
    SQL_DIR: /opt/airflow/sql
    FIXTURES_DIR: /opt/airflow/fixtures
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./fixtures:/opt/airflow/fixtures
    - ./tests:/opt/airflow/tests
    - ./pyproject.toml:/opt/airflow/pyproject.toml
    - ./data:/opt/airflow/data   # shared volume for raw/processed files across tasks
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GITHUB_DB_USER: ${GITHUB_DB_USER}
      GITHUB_DB_PASSWORD: ${GITHUB_DB_PASSWORD}
      GITHUB_DB_NAME: ${GITHUB_DB_NAME}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./docker/postgres/init-github-db.sh:/docker-entrypoint-initdb.d/10-init-github-db.sh:ro
    ports:
      - "5432:5432"   # lets you inspect data with psql/DBeaver from your machine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/data
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data
        /entrypoint airflow version
        echo "Creating pipeline tables..."
        python -m github_ingestion.migrate public fixture
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off commands: docker compose run --rm airflow-cli python -m pytest
  airflow-cli:
    <<: *airflow-common
    profiles: [debug]
    entrypoint: []
    command: ["airflow", "version"]
    working_dir: /opt/airflow

volumes:
  postgres-db-volume:
